[project]
name = "serveshed"
version = "0.2.0"
description = "ServeShed — a local-first LLM control plane for Ubuntu Desktop"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "serveshed contributors" }]
dependencies = []

[project.scripts]
serveshed = "serveshed.cli:main"

[build-system]
requires = []
build-backend = "serveshed_build"
backend-path = ["."]

[tool.uv]
package = true

[tool.serveshed.dev-tools]
ruff = "0.16.3"
mypy = "2.3.0"
pytest = "9.1.1"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "eval-runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/serveshed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
